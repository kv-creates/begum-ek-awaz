; PlatformIO Project Configuration — Begum Offline Voice Activator
; Board: ESP8266 (WeMos D1 mini / NodeMCU). 100% OFFLINE: no WiFi/Ethernet/UDP/MQTT/WebSockets.
; Optimizations: -Os -g0 for minimal flash/RAM.

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs

; Strictly offline: do NOT add ESP8266WiFi, ESP8266WebServer, PubSubClient, WebSockets, etc.
lib_deps =
  olikraus/U8g2@^2.1.20
  arduino-libraries/Arduino_TensorFlowLite@^2.4.0-ALPHA

lib_ldf_mode = deep+

build_flags =
  -Os
  -g0
  -fno-exceptions
  -DTFLITE_STATIC_MEMORY
  -DESP8266
  -DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK3
  -Wall

build_unflags =
  -g
  -O2

; 4M flash, 80MHz is enough and lowest power; 160MHz optional for headroom.
board_build.f_cpu = 80000000L
